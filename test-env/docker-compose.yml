# Isolated Odoo 19 CE instance used only for developing and testing
# odoo-mcp-governed. Not for production, not shared with any other project.
# Ports are bound to 127.0.0.1: this instance has the well-known admin/admin
# credentials and must not be reachable from the network.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - govtest-db:/var/lib/postgresql/data

  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "127.0.0.1:65010:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - govtest-web:/var/lib/odoo

volumes:
  govtest-db:
  govtest-web:
